<?xml version="1.0" encoding="UTF-8"?>
<!-- 天枢图标（48）：北斗 α 星「枢星」的四芒，外围一道星轨。单色 currentColor，
     与侧栏图标同形，深浅主题都随宿主文字色。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="天枢">
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0.62"/>
    </linearGradient>
  </defs>
  <!-- 枢星：四芒 -->
  <path d="M24 6 L27.2 20.8 L42 24 L27.2 27.2 L24 42 L20.8 27.2 L6 24 L20.8 20.8 Z"
        fill="url(#core)" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- 星芯 -->
  <circle cx="24" cy="24" r="3.4" fill="currentColor"/>
  <!-- 星轨：绕枢星的一段弧 -->
  <path d="M38.6 12.8 A 19.6 19.6 0 0 1 32.2 39.4"
        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
  <!-- 伴星 -->
  <circle cx="40.4" cy="11.2" r="2" fill="currentColor" opacity="0.55"/>
</svg>

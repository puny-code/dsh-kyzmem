<?xml version="1.0" encoding="UTF-8"?>
<!-- 天枢大图标：256×256，用作市场卡片与详情页头图。
     意象：紫微垣的枢轴——北斗 α 星。深靛夜空里一颗金色四芒星，外围一道倾斜的星轨，
     轨道上两颗伴星；金色取北斗定位的星图传统，靛底保证在浅色宿主界面上也站得住。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="天枢">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B2350"/>
      <stop offset="52%" stop-color="#121739"/>
      <stop offset="100%" stop-color="#0A0D22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.5">
      <stop offset="0%" stop-color="#FFD37A" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#F0B429" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#F0B429" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FFF1C9"/>
      <stop offset="46%" stop-color="#F8CE6B"/>
      <stop offset="100%" stop-color="#E9A22B"/>
    </linearGradient>
  </defs>

  <!-- 夜空背板 -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#night)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#F0B429" stroke-opacity="0.22" stroke-width="2"/>

  <!-- 星芒辉光 -->
  <circle cx="124" cy="118" r="104" fill="url(#glow)"/>

  <!-- 星轨：倾斜的椭圆轨道（虚线，暗示运转而非静止） -->
  <g transform="rotate(-18 128 128)" fill="none">
    <ellipse cx="128" cy="128" rx="104" ry="64" stroke="#F6D68C" stroke-opacity="0.34" stroke-width="2.4" stroke-dasharray="7 11"/>
  </g>

  <!-- 伴星：轨道上两颗小星 -->
  <circle cx="196" cy="76" r="6" fill="#FFE7B0" fill-opacity="0.9"/>
  <circle cx="196" cy="76" r="13" fill="#FFE7B0" fill-opacity="0.10"/>
  <circle cx="63" cy="182" r="4.5" fill="#FFE7B0" fill-opacity="0.75"/>
  <circle cx="63" cy="182" r="11" fill="#FFE7B0" fill-opacity="0.08"/>

  <!-- 枢星：四芒 -->
  <path d="M124 44 L141 105 L202 122 L141 139 L124 200 L107 139 L46 122 L107 105 Z"
        fill="url(#star)" stroke="#FFF4D6" stroke-opacity="0.55" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- 星芯 -->
  <circle cx="124" cy="122" r="9" fill="#FFFCF0"/>
</svg>

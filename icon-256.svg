<?xml version="1.0" encoding="UTF-8"?>
<!-- 天枢大图标：浅底。椭圆纸面 + 外圈细椭圆框（与星轨同心同倾），
     金色枢星 + 青色星轨，与侧栏单色线条图标同源（四芒星 + 星轨弧）。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="天枢">
  <defs>
    <linearGradient id="starB" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FFF7DC"/>
      <stop offset="45%" stop-color="#FBD47A"/>
      <stop offset="100%" stop-color="#E79F1F"/>
    </linearGradient>
    <radialGradient id="haloB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FDEFBF" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#FDEFBF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FDEFBF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paperB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAF0F8"/>
    </linearGradient>
  </defs>

  <!-- 椭圆底（与外框同形，浅纸色填充） -->
  <g transform="rotate(-18 128 128)" fill="none">
    <ellipse cx="128" cy="128" rx="114" ry="86" fill="url(#paperB)" stroke="none"/>
  </g>

  <!-- 外圈椭圆框 -->
  <g transform="rotate(-18 128 128)" fill="none">
    <ellipse cx="128" cy="128" rx="114" ry="86" stroke="#C9D6EA" stroke-width="2.5"/>
  </g>

  <!-- 淡金辉光 -->
  <circle cx="128" cy="128" r="92" fill="url(#haloB)"/>

  <!-- 星轨后半（虚线，星后穿过） -->
  <g transform="rotate(-18 128 128)" fill="none">
    <ellipse cx="128" cy="128" rx="100" ry="60" stroke="#0E9B94" stroke-opacity="0.24" stroke-width="2.6" stroke-dasharray="5 8" stroke-linecap="round"/>
  </g>

  <!-- 枢星：四芒 -->
  <path d="M128 46 L145 111 L206 128 L145 145 L128 206 L111 145 L50 128 L111 111 Z"
        fill="url(#starB)" stroke="#9A6307" stroke-width="3" stroke-linejoin="round"/>
  <!-- 星芒内脊线（白，提层次） -->
  <path d="M128 62 L139 117 L189 128 L139 139 L128 190 L117 139 L67 128 L117 117 Z"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- 星芯 -->
  <circle cx="128" cy="128" r="9" fill="#FFFDF3" stroke="#E9A22B" stroke-width="2"/>
  <circle cx="128" cy="128" r="3.2" fill="#E79F1F"/>
  <ellipse cx="124.5" cy="124" rx="4.5" ry="3" fill="#FFFFFF" opacity="0.9"/>

  <!-- 星轨前半（实线，星前穿过；收细收短，不抢主星） -->
  <g transform="rotate(-18 128 128)" fill="none">
    <path d="M38 153 A 100 60 0 0 0 226 138" stroke="#0E9B94" stroke-opacity="0.72" stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <!-- 伴星（白圈隔离轨道线，小尺寸不黏连） -->
  <circle cx="199" cy="79" r="12" fill="#0E9B94" opacity="0.12"/>
  <circle cx="199" cy="79" r="7" fill="#0E9B94" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="199" cy="79" r="2.6" fill="#D8F5F2"/>
  <circle cx="50" cy="180" r="10.5" fill="#E9A22B" opacity="0.14"/>
  <circle cx="50" cy="180" r="5.5" fill="#E9A22B" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="50" cy="180" r="2" fill="#FFF7DC"/>

  <!-- 小闪星点缀 -->
  <path d="M76 60 L78.5 68 L86 70.5 L78.5 73 L76 81 L73.5 73 L66 70.5 L73.5 68 Z" fill="#0E9B94" opacity="0.6"/>
</svg>

version: 2
updates:
  # 运行时依赖只有 @huggingface/transformers，但它拖着 onnxruntime/sharp 重链——
  # 升级走 weekly，minor/patch 打组（一条 PR），major 单独出。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
